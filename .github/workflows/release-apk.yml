name: Publier l'APK

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/network-domains-test-build-5gz8mx"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Construire l'APK release (clé d'essai, numéro de build injecté)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Publier en Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "mk-copilot-build-${{ github.run_number }}.apk"
          gh release create "apk-build-${{ github.run_number }}" \
            "mk-copilot-build-${{ github.run_number }}.apk" \
            --title "MK Copilot — APK d'essai (build ${{ github.run_number }})" \
            --notes "APK release minifié, signé avec la clé d'essai (pas pour le Play Store). ⚠️ Si Android affiche « Application non installée » : une version antérieure au build 4 (ancienne signature) est encore installée — désinstallez MK Copilot une fois, puis réinstallez ; ensuite les mises à jour s'installent par-dessus via le bandeau intégré. Branche : ${{ github.ref_name }}, commit : ${{ github.sha }}" \
            --target "${{ github.sha }}"
